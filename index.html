<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐰 菟籽 OS · 工作室操作系统</title>
<style>
:root{
  --pink-50:#fdf2f8;--pink-100:#fce7f3;--pink-200:#fbcfe8;--pink-300:#f9a8d4;
  --pink-400:#f472b6;--pink-500:#ec4899;--pink-600:#db2777;
  --carrot:#fb923c;--carrot-light:#fed7aa;
  --ink:#3f3f46;--ink-soft:#71717a;--ink-light:#a1a1aa;
  --line:#e4e4e7;--bg:#fafafa;--card:#ffffff;
  --green:#10b981;--amber:#f59e0b;--red:#ef4444;--blue:#3b82f6;
  --radius:14px;--shadow:0 1px 3px rgba(0,0,0,.05),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(236,72,153,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--pink-600);text-decoration:none}
.topbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#fff 0%,var(--pink-50) 100%);border-bottom:1px solid var(--pink-100)}
.topbar-inner{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:700;color:var(--pink-600);white-space:nowrap}
.brand small{font-size:11px;font-weight:400;color:var(--ink-light);margin-left:4px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1;justify-content:center}
.tab{padding:8px 14px;border-radius:999px;font-size:13px;color:var(--ink-soft);transition:all .15s;white-space:nowrap}
.tab:hover{background:var(--pink-100);color:var(--pink-600)}
.tab.active{background:var(--pink-500);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(236,72,153,.3)}
.topbar-actions{display:flex;gap:6px;align-items:center}
.icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-soft);transition:all .15s}
.icon-btn:hover{background:var(--pink-100);color:var(--pink-600)}
.page{max-width:1200px;margin:0 auto;padding:24px;display:none}
.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.page-head h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
.page-head .sub{font-size:12px;color:var(--ink-light);font-weight:400;margin-left:8px}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:var(--pink-500);color:#fff}
.btn-primary:hover{background:var(--pink-600)}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--pink-300);color:var(--pink-600)}
.btn-danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-success:hover{background:#059669}
.btn-sm{padding:4px 10px;font-size:12px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1}
.search{position:relative;flex:1;max-width:320px}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:8px;background:#fff}
.search input:focus{outline:none;border-color:var(--pink-400);box-shadow:0 0 0 3px var(--pink-100)}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-light)}
select.filter{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink-soft);cursor:pointer}
select.filter:focus{outline:none;border-color:var(--pink-400)}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--pink-50);color:var(--ink-soft);font-weight:600;text-align:left;padding:10px 14px;white-space:nowrap}
td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:middle}
tr:hover td{background:var(--pink-50)}
.cell-main{font-weight:600;color:var(--ink)}
.cell-sub{font-size:11px;color:var(--ink-light)}
.link-row{cursor:pointer}
.link-row:hover .cell-main{color:var(--pink-600)}
.empty{text-align:center;padding:40px 20px;color:var(--ink-light)}
.empty .em{font-size:32px;display:block;margin-bottom:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-cub{background:#fdf2f8;color:var(--pink-600)}
.b-small{background:#fce7f3;color:var(--pink-600)}
.b-big{background:#fbcfe8;color:var(--pink-600)}
.b-king{background:var(--carrot-light);color:#c2410c}
.b-elder{background:#fef3c7;color:#b45309}
.b-none{background:#f4f4f5;color:#a1a1aa}
.b-new{background:#dbeafe;color:#2563eb}
.b-old{background:#dcfce7;color:#16a34a}
.b-long{background:#f3e8ff;color:#9333ea}
.b-wait{background:#f1f5f9;color:#64748b}
.b-doing{background:#fef3c7;color:#b45309}
.b-deliver{background:#dbeafe;color:#2563eb}
.b-done{background:#dcfce7;color:#16a34a}
.b-cancel{background:#fee2e2;color:#dc2626}
.b-urgent{background:#fee2e2;color:#dc2626}
.b-balance{background:#f3e8ff;color:#9333ea}
.b-cash{background:#dcfce7;color:#16a34a}
.b-mix{background:#fef3c7;color:#b45309}
.dash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.dash-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.dash-card.c1::before{background:var(--pink-400)}
.dash-card.c2::before{background:var(--amber)}
.dash-card.c3::before{background:var(--carrot)}
.dash-card.c4::before{background:var(--pink-500)}
.dash-card h3{font-size:13px;color:var(--ink-soft);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.dash-stat{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}
.dash-stat .num{font-size:28px;font-weight:700;color:var(--ink)}
.dash-stat .unit{font-size:12px;color:var(--ink-light)}
.dash-mini{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px}
.dash-mini div{color:var(--ink-soft)}
.dash-mini b{color:var(--ink);font-weight:600}
.slot-chip{display:inline-block;margin:3px 3px 0 0;padding:3px 8px;border-radius:6px;background:var(--pink-50);color:var(--pink-600);font-size:11px;border:1px solid var(--pink-100)}
.slot-chip.full{background:#fee2e2;color:#dc2626;border-color:#fecaca}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:520px;max-width:92vw;background:#fff;z-index:201;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.08)}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--pink-50)}
.drawer-head h3{font-size:15px;font-weight:700;color:var(--ink)}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.drawer-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#fff}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:5px}
.form-row label .opt{color:var(--ink-light);font-weight:400;margin-left:4px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{outline:none;border-color:var(--pink-400);box-shadow:0 0 0 3px var(--pink-100)}
.form-row textarea{resize:vertical;min-height:64px}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hint{font-size:11px;color:var(--ink-light);margin-top:4px}
.hint.upgrade{color:var(--amber);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-soft)}
.toggle input{width:auto}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;cursor:pointer;user-select:none}
.checks input{width:auto;margin-right:2px}
.checks label:has(input:checked){background:var(--pink-100);border-color:var(--pink-300);color:var(--pink-600)}
.tag-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:var(--pink-50);border:1px solid var(--pink-200);border-radius:999px;font-size:12px;color:var(--pink-600)}
.tag-pill .x{cursor:pointer;color:var(--ink-light);font-weight:700}
.tag-pill .x:hover{color:var(--red)}
.detail-sec{margin-bottom:20px}
.detail-sec h4{font-size:12px;color:var(--ink-light);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink-light);white-space:nowrap}
.kv dd{color:var(--ink);font-weight:500}
.mini-table{width:100%;font-size:12px}
.mini-table th{font-size:11px;padding:6px 8px;background:var(--bg)}
.mini-table td{padding:6px 8px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav .month{font-size:16px;font-weight:700;min-width:120px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:12px;color:var(--ink-light);font-weight:600;padding:6px 0}
.cal-day{min-height:92px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer;transition:all .12s;position:relative}
.cal-day:hover{border-color:var(--pink-300);box-shadow:var(--shadow-md)}
.cal-day.empty{background:transparent;border:none;cursor:default;pointer-events:none}
.cal-day.today{border-color:var(--pink-500);border-width:2px}
.cal-day.rest{background:#fef2f2;border-style:dashed}
.cal-day .dnum{font-size:13px;font-weight:600;color:var(--ink-soft)}
.cal-day.today .dnum{color:var(--pink-600)}
.cal-day .evts{margin-top:4px}
.cal-evt{font-size:10px;padding:1px 5px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--pink-100);color:var(--pink-600)}
.cal-evt.done{background:#dcfce7;color:#16a34a}
.cal-evt.cancel{background:#fee2e2;color:#dc2626;text-decoration:line-through}
.cal-rest-tag{font-size:10px;padding:1px 5px;border-radius:4px;background:#fee2e2;color:#dc2626}
.mem-group{margin-bottom:18px}
.mem-group-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.mem-group-head .title{font-size:14px;font-weight:700}
.mem-group-head .count{font-size:12px;color:var(--ink-light)}
.chart-box{margin-bottom:20px}
.chart-box h4{font-size:13px;font-weight:600;margin-bottom:10px;color:var(--ink-soft)}
.bars{display:flex;align-items:flex-end;gap:6px;height:160px;padding:10px 0;border-bottom:1px solid var(--line)}
.bar{flex:1;background:linear-gradient(180deg,var(--pink-400),var(--pink-300));border-radius:4px 4px 0 0;position:relative;min-height:2px}
.bar:hover{background:linear-gradient(180deg,var(--pink-500),var(--pink-400))}
.bar .lbl{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink-light)}
.bar .val{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink);font-weight:600}
.bars-wrap{padding-bottom:24px}
.pie-legend{display:flex;flex-direction:column;gap:6px;margin-top:10px;font-size:12px}
.pie-legend .row{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-radius:6px;background:var(--bg)}
.pie-legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.3)}
.modal-box{position:relative;background:#fff;border-radius:var(--radius);width:520px;max-width:92vw;max-height:86vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.15)}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:var(--pink-50)}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;z-index:300;transition:transform .25s;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}
.menu{position:absolute;right:24px;top:60px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.1);z-index:150;padding:6px;min-width:200px;display:none}
.menu.show{display:block}
.menu-item{padding:8px 12px;border-radius:6px;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.menu-item:hover{background:var(--pink-50);color:var(--pink-600)}
.menu-sep{height:1px;background:var(--line);margin:4px 0}
.copy-box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;white-space:pre-wrap;font-size:13px;line-height:1.7;max-height:400px;overflow-y:auto;user-select:all}
.task-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;transition:all .15s}
.task-row:hover{border-color:var(--pink-300);box-shadow:var(--shadow-md)}
.task-row.done{background:#f9fafb;opacity:.65}
.task-row.done .cell-main{text-decoration:line-through;color:var(--ink-light)}
.task-info{flex:1}
.pay-detail{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;font-size:12px}
.pay-row{display:flex;justify-content:space-between;padding:2px 0}
.pay-row.total{font-weight:700;border-top:1px dashed var(--line);margin-top:4px;padding-top:6px}
.bday-alert{background:linear-gradient(135deg,#fef3c7,#fde68a);border:1px solid #fcd34d;border-radius:12px;padding:16px;margin-bottom:16px}
.bday-alert h3{font-size:15px;color:#92400e;margin-bottom:8px}
@media(max-width:680px){
  .topbar-inner{padding:10px 14px;gap:10px}
  .brand small{display:none}
  .tabs{justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap}
  .page{padding:14px}
  .form-grid-2,.form-grid-3{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:1fr}
  .task-row{flex-wrap:wrap}
}

/* ===== 同步状态徽章 ===== */
.sync-badge{position:fixed;top:14px;right:14px;z-index:1000;font-size:11px;padding:4px 10px;border-radius:999px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1);transition:all .2s}
.sync-badge.syncing{background:#fef3c7;color:#f59e0b}
.sync-badge.ok{background:#d1fae5;color:#10b981}
.sync-badge.err{background:#fee2e2;color:#ef4444}
</style>
</head>
<body>

<!-- 同步状态徽章 -->
<div id="syncBadge" class="sync-badge" style="display:none">● 待同步</div>

<header class="topbar" id="appTopbar">
  <div class="topbar-inner">
    <div class="brand">🐰 菟籽 OS <small>V1.2 · 工作室操作系统</small></div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-page="dashboard">🐰 首页</button>
      <button class="tab" data-page="customers">👤 客户</button>
      <button class="tab" data-page="schedule">📅 排单</button>
      <button class="tab" data-page="members">🥕 会员</button>
      <button class="tab" data-page="orders">📦 订单</button>
      <button class="tab" data-page="stats">📈 统计</button>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="menuBtn" title="设置">⚙️</button>
    </div>
  </div>
  <div class="menu" id="menu">
    <button class="menu-item" data-act="export">📤 导出数据备份</button>
    <button class="menu-item" data-act="import">📥 导入数据</button>
    <div class="menu-sep"></div>
    <button class="menu-item" data-act="demo">🐰 载入演示数据</button>
    <button class="menu-item" data-act="clearDemo">🧹 清空演示数据</button>
    <div class="menu-sep"></div>
    <button class="menu-item" data-act="clearAll" style="color:var(--red)">🗑️ 清空全部数据</button>
  </div>
</header>
<input type="file" id="importFile" accept=".json" style="display:none">
<main id="appMain">
<section class="page active" id="page-dashboard">
  <div class="page-head"><h2>🐰 今日工作台 <span class="sub" id="todayLabel"></span></h2></div>
  <div id="bdayAlertBox"></div>
  <div class="dash-grid" id="dashGrid"></div>
  <div class="dash-grid" id="dashUpgrade" style="margin-top:14px"></div>
  <div id="dashTasks" style="margin-top:14px"></div>
  <div style="margin-top:18px;font-size:12px;color:var(--ink-light);text-align:center">💡 每天打开这个页面，一眼看全今天该做的事</div>
</section>
<section class="page" id="page-customers">
  <div class="page-head"><h2>👤 客户管理</h2><button class="btn btn-primary" onclick="openCustomerForm()">＋ 新建客户</button></div>
  <div class="toolbar">
    <div class="search"><span class="ic">🔍</span><input id="custSearch" placeholder="搜索昵称、备注、手机号…" oninput="renderCustomers()"></div>
    <button class="btn btn-ghost btn-sm" onclick="toggleCustFilterPanel()">⚙️ 筛选排序</button>
    <select class="filter" id="custSort" onchange="renderCustomers()">
      <option value="recent">最近消费</option>
      <option value="spent-desc">累计消费 高→低</option>
      <option value="spent-asc">累计消费 低→高</option>
      <option value="level-desc">等级 高→低</option>
      <option value="level-asc">等级 低→高</option>
      <option value="balance-desc">余额 高→低</option>
      <option value="balance-asc">余额 低→高</option>
      <option value="created-desc">注册时间 新→旧</option>
      <option value="created-asc">注册时间 旧→新</option>
    </select>
    <span id="custFilterBadge" style="font-size:12px;color:var(--pink-600);display:none"></span>
  </div>
  <div id="custFilterPanel" style="display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><b style="font-size:13px">筛选条件</b><button class="btn btn-ghost btn-sm" onclick="clearCustFilters()">清空全部</button></div>
    <div class="form-grid-2">
      <div class="form-row"><label>会员等级 <span class="opt">可多选</span></label><div class="checks" id="custFilterLevels"></div></div>
      <div class="form-row"><label>其他筛选</label><div class="checks">
        <label><input type="checkbox" id="cfMember" onchange="renderCustomers()"> 仅会员</label>

      .from('workbench_data')

/* ---------- 截止时间计算：工作时长12小时(09-23)，非工作时间跳过 ---------- */
function calcDeadline(startDT,hours=12){
  if(!startDT)return '';
  const start=new Date(startDT);if(isNaN(start))return '';
  let remaining=hours*60; // 分钟
  const cursor=new Date(start);
  const guard=new Date(start.getTime()+30*24*3600*1000); // 防死循环
  while(remaining>0 && cursor<guard){
    const h=cursor.getHours();
    if(h>=WORK_START && h<WORK_END){
      // 当前小时在工作时间内，算到本小时结束
      const hourEnd=new Date(cursor);hourEnd.setMinutes(60,0,0);
      const avail=Math.min(60-cursor.getMinutes(),remaining);
      cursor.setMinutes(cursor.getMinutes()+avail);
      remaining-=avail;
      if(avail===0)cursor=new Date(cursor.getTime()+60000);
    }else{
      // 跳到下一个工作日09:00
      cursor.setHours(WORK_START,0,0,0);
      if(cursor.getHours()<=h)cursor.setDate(cursor.getDate()+1);
      cursor.setHours(WORK_START,0,0,0);
    }
  }
  return fmtDateTimeLocal(cursor);
}
/* ---------- 支付方式自动计算 ---------- */
function calcPayment(amount,balance){
  amount=Number(amount)||0;balance=Number(balance)||0;
  if(balance>=amount && amount>0){
    return {method:'balance',balancePay:amount,cashPay:0};
  }else if(balance>0){
    return {method:'mix',balancePay:balance,cashPay:amount-balance};
  }else{
    return {method:'cash',balancePay:0,cashPay:amount};
  }
}

function getSlotUsage(ds){
  const usage={'上午':0,'下午':0,'晚上':0};
  const startDay=new Date(ds+'T09:00');if(isNaN(startDay))return usage;
  DB.orders.forEach(o=>{
    if(!o.startTime||!o.imageCount)return;
    if((o.orderTime||'').slice(0,10)!==ds)return;
    const start=new Date(o.startTime);if(isNaN(start))return;
    let offsetMin=(start-startDay)/60000;
    if(offsetMin<0)offsetMin=0;
    const durationMin=Number(o.imageCount)*60;
    const endMin=offsetMin+durationMin;
    const ranges={'上午':[0,180],'下午':[180,480],'晚上':[480,780]};
    for(const slot in ranges){const [s,e]=ranges[slot];const inter=Math.max(0,Math.min(endMin,e)-Math.max(offsetMin,s));usage[slot]+=inter/60;}
  });
  return usage;
}

  const tab=e.target.closest('.tab');if(!tab)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');const p=tab.dataset.page;
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));
  $('page-'+p).classList.add('active');
  if(p==='dashboard')renderDashboard();
  if(p==='customers')renderCustomers();
  if(p==='schedule')renderCalendar();
  if(p==='members')renderMembers();
  if(p==='orders')renderOrders();
  if(p==='stats')renderStats();
});

/* ---------- 抽屉 ---------- */
function openDrawer(title,bodyHtml,footHtml){$('drawerTitle').innerHTML=title;$('drawerBody').innerHTML=bodyHtml;$('drawerFoot').innerHTML=footHtml||'';$('overlay').classList.add('show');$('drawer').classList.add('show');}
function closeDrawer(){$('overlay').classList.remove('show');$('drawer').classList.remove('show');}

/* ---------- 菜单 ---------- */
$('menuBtn').addEventListener('click',e=>{e.stopPropagation();$('menu').classList.toggle('show');});
document.addEventListener('click',()=>$('menu').classList.remove('show'));
$('menu').addEventListener('click',e=>{const item=e.target.closest('.menu-item');if(!item)return;const act=item.dataset.act;$('menu').classList.remove('show');
  if(act==='export')doExport();if(act==='import')$('importFile').click();if(act==='demo')confirmAct('载入演示数据？会保留现有数据。',loadDemo);if(act==='clearDemo')confirmAct('清空演示数据？',clearDemo);if(act==='clearAll')confirmAct('⚠️ 清空全部数据？所有客户、订单、排单都将删除且无法恢复！',clearAll);});
$('importFile').addEventListener('change',doImport);
function doExport(){const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`tuzi-os-backup-${todayStr()}.json`;a.click();URL.revokeObjectURL(url);toast('备份已导出','ok');}
function doImport(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(!data.customers)throw new Error('格式不对');DB=data;if(!DB.schedules)DB.schedules=[];if(!DB.recharges)DB.recharges=[];if(!DB.restDays)DB.restDays=[];if(!DB.tags)DB.tags=['韩系','网感','幼态'];save();toast('导入成功','ok');renderAll();}catch(err){toast('导入失败：'+err.message,'err');}};reader.readAsText(file);e.target.value='';}
function clearAll(){DB={customers:[],orders:[],schedules:[],recharges:[],restDays:[],tags:['韩系','网感','幼态'],custPlans:[],ordPlans:[],meta:{version:3,createdAt:Date.now(),counters:{c:1,o:1,s:1,r:1}}};save();renderAll();toast('已清空','ok');}
function clearDemo(){DB.customers=DB.customers.filter(c=>!c._demo);DB.orders=DB.orders.filter(o=>!o._demo);DB.schedules=DB.schedules.filter(s=>!s._demo);DB.recharges=DB.recharges.filter(r=>!r._demo);save();renderAll();toast('演示数据已清除','ok');}

/* ============================================================
   客户管理
   ============================================================ */
function renderCustFilterLevels(){
  const box=$('custFilterLevels');if(!box)return;
  box.innerHTML=LEVELS.map(l=>`<label><input type="checkbox" value="${l}" onchange="renderCustomers()"> ${levelBadge(l)}</label>`).join('')+'<label><input type="checkbox" value="none" onchange="renderCustomers()"> <span class="badge b-none">未入等级</span></label>';
}
function renderOrdFilterStatuses(){
  const box=$('ordFilterStatuses');if(!box)return;
  box.innerHTML=ORDER_STATUS.map(s=>`<label><input type="checkbox" value="${s}" onchange="renderOrders()"> ${statusBadge(s)}</label>`).join('');
}
function renderCustomers(){
  if(!$('custFilterLevels').children.length)renderCustFilterLevels();
  const q=($('custSearch').value||'').trim().toLowerCase();
  // 等级多选
  const levelChks=document.querySelectorAll('#custFilterLevels input:checked');
  const levelSet=new Set([...levelChks].map(c=>c.value));
  // 其他筛选
  const cfMember=$('cfMember')?.checked;
  const cfHasBalance=$('cfHasBalance')?.checked;
  const cfBirthday=$('cfBirthday')?.checked;
  const cfNotify=$('cfNotify')?.checked;
  const spentMin=Number($('cfSpentMin')?.value)||0;
  const spentMax=Number($('cfSpentMax')?.value)||0;
  const cfRecent=$('cfRecent')?.value||'';
  const sort=$('custSort').value||'recent';
  let list=DB.customers.slice();
  if(q)list=list.filter(c=>[c.wechatName,c.douyinName,c.wechatNote,c.phone,c.id].some(v=>(v||'').toLowerCase().includes(q)));
  if(levelSet.size){list=list.filter(c=>{const lv=calcLevel(c.totalSpent)||'none';return levelSet.has(lv);});}
  if(cfMember)list=list.filter(c=>calcLevel(c.totalSpent));
  if(cfHasBalance)list=list.filter(c=>(Number(c.balance)||0)>0);
  if(cfBirthday){const m=String(new Date().getMonth()+1).padStart(2,'0');list=list.filter(c=>{const b=c.birthday||'';return b.length===5&&b.slice(0,2)===m;});}
  if(cfNotify)list=list.filter(c=>c.notifyOptIn===true);
  if(spentMin)list=list.filter(c=>(Number(c.totalSpent)||0)>=spentMin);
  if(spentMax)list=list.filter(c=>(Number(c.totalSpent)||0)<=spentMax);
  if(cfRecent){const days=parseInt(cfRecent);const limit=new Date(Date.now()-days*86400000);list=list.filter(c=>{const d=new Date(c.lastOrderDate||'');return !isNaN(d)&&d>=limit;});}
  // 排序
  const levelOrder={'兔兔长老':5,'兔兔王':4,'大兔兔':3,'小兔兔':2,'兔崽子':1,null:0};
  if(sort==='spent-desc')list.sort((a,b)=>(b.totalSpent||0)-(a.totalSpent||0));
  else if(sort==='spent-asc')list.sort((a,b)=>(a.totalSpent||0)-(b.totalSpent||0));
  else if(sort==='level-desc')list.sort((a,b)=>(levelOrder[calcLevel(b.totalSpent)]||0)-(levelOrder[calcLevel(a.totalSpent)]||0));
  else if(sort==='level-asc')list.sort((a,b)=>(levelOrder[calcLevel(a.totalSpent)]||0)-(levelOrder[calcLevel(b.totalSpent)]||0));
  else if(sort==='balance-desc')list.sort((a,b)=>(b.balance||0)-(a.balance||0));
  else if(sort==='balance-asc')list.sort((a,b)=>(a.balance||0)-(b.balance||0));
  else if(sort==='created-desc')list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  else if(sort==='created-asc')list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  else list.sort((a,b)=>(b.lastOrderDate||'').localeCompare(a.lastOrderDate||''));
  // 更新筛选badge
  const cnt=levelSet.size+(cfMember?1:0)+(cfHasBalance?1:0)+(cfBirthday?1:0)+(cfNotify?1:0)+(spentMin?1:0)+(spentMax?1:0)+(cfRecent?1:0);
  const badge=$('custFilterBadge');
  if(badge){badge.style.display=cnt?'':'none';badge.textContent=cnt?('筛选中 '+cnt):'';}
  const tb=$('custTbody');
  if(!list.length){tb.innerHTML=`<tr><td colspan="8"><div class="empty"><span class="em">🐰</span>没有符合条件的客户</div></td></tr>`;return;}
  tb.innerHTML=list.map(c=>`<tr class="link-row" onclick="openCustomerDetail('${c.id}')">
    <td class="cell-sub">${c.id}</td>
    <td><div class="cell-main">${esc(custName(c))}</div>${c.douyinName?`<div class="cell-sub">抖：${esc(c.douyinName)}</div>`:''}</td>
    <td class="cell-sub">${esc(c.wechatNote||'—')}</td>
    <td>${levelBadge(calcLevel(c.totalSpent))}</td>
    <td>${fmtMoney(c.totalSpent)}🥕</td>
    <td>${fmtMoney(c.balance)}🥕</td>
    <td class="cell-sub">${fmtDate(c.lastOrderDate)}</td>
    <td>${custStatusBadge(c.status||'新客户')}${c.notifyOptIn?' <span class="badge" style="background:#dcfce7;color:#16a34a">📢可通知</span>':''}</td></tr>`).join('');
}
function toggleCustFilterPanel(){const p=$('custFilterPanel');p.style.display=p.style.display==='none'?'block':'none';if(p.style.display==='block')renderCustSavedPlans();}
function clearCustFilters(){document.querySelectorAll('#custFilterLevels input').forEach(c=>c.checked=false);['cfMember','cfHasBalance','cfBirthday','cfNotify'].forEach(id=>{if($(id))$(id).checked=false;});['cfSpentMin','cfSpentMax'].forEach(id=>{if($(id))$(id).value='';});if($('cfRecent'))$('cfRecent').value='';renderCustomers();}
function getCustFilterState(){return{levels:[...document.querySelectorAll('#custFilterLevels input:checked')].map(c=>c.value),member:$('cfMember')?.checked,hasBalance:$('cfHasBalance')?.checked,birthday:$('cfBirthday')?.checked,notify:$('cfNotify')?.checked,spentMin:$('cfSpentMin')?.value||'',spentMax:$('cfSpentMax')?.value||'',recent:$('cfRecent')?.value||'',sort:$('custSort').value};}
function applyCustFilterState(s){clearCustFilters();s.levels.forEach(v=>{const el=document.querySelector(`#custFilterLevels input[value="${v}"]`);if(el)el.checked=true;});if(s.member&&$('cfMember'))$('cfMember').checked=true;if(s.hasBalance&&$('cfHasBalance'))$('cfHasBalance').checked=true;if(s.birthday&&$('cfBirthday'))$('cfBirthday').checked=true;if(s.notify&&$('cfNotify'))$('cfNotify').checked=true;if($('cfSpentMin'))$('cfSpentMin').value=s.spentMin;if($('cfSpentMax'))$('cfSpentMax').value=s.spentMax;if($('cfRecent'))$('cfRecent').value=s.recent;if($('custSort'))$('custSort').value=s.sort;renderCustomers();}
function saveCustPlan(){const name=$('custPlanName').value.trim();if(!name){toast('请输入方案名称','err');return;}if(!DB.custPlans)DB.custPlans=[];const state=getCustFilterState();DB.custPlans.push({name,state,createdAt:Date.now()});save();$('custPlanName').value='';renderCustSavedPlans();toast('方案已保存','ok');}
function renderCustSavedPlans(){const box=$('custSavedPlans');if(!box)return;if(!DB.custPlans)DB.custPlans=[];box.innerHTML=DB.custPlans.map((p,i)=>`<button class="btn btn-ghost btn-sm" onclick="applyCustPlan(${i})">📁 ${esc(p.name)}</button><button class="btn btn-ghost btn-sm" onclick="deleteCustPlan(${i})" style="color:var(--red);padding:2px 6px">✕</button>`).join('')||'<span style="font-size:12px;color:var(--ink-light)">暂无保存方案</span>';}
function applyCustPlan(i){if(!DB.custPlans||!DB.custPlans[i])return;applyCustFilterState(DB.custPlans[i].state);toast('已应用方案：'+DB.custPlans[i].name,'ok');}
function deleteCustPlan(i){DB.custPlans.splice(i,1);save();renderCustSavedPlans();toast('已删除','ok');}
function openCustomerForm(id){

  const body=`<form id="custForm" onsubmit="return false">
    <div class="form-grid-2"><div class="form-row"><label>微信昵称</label><input name="wechatName" value="${esc(data.wechatName||'')}" placeholder="必填"></div>
    <div class="form-row"><label>抖音昵称 <span class="opt">可选</span></label><input name="douyinName" value="${esc(data.douyinName||'')}"></div></div>
    <div class="form-grid-2"><div class="form-row"><label>微信备注 <span class="opt">可选</span></label><input name="wechatNote" value="${esc(data.wechatNote||'')}"></div>
    <div class="form-row"><label>手机号 <span class="opt">可选</span></label><input name="phone" value="${esc(data.phone||'')}"></div></div>
    <div class="form-grid-2"><div class="form-row"><label>会员等级 <span class="opt">按累计消费自动算</span></label>
      <div style="padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">${levelBadge(up.level)} ${up.next?`<span class="hint upgrade" style="display:inline;margin-left:6px">距 ${up.next} 还差 ${up.need}🥕</span>`:'<span class="hint" style="display:inline;margin-left:6px">已达最高 👑</span>'}</div></div>
    <div class="form-row"><label>客户状态</label><select name="status">${CUST_STATUS.map(s=>`<option ${data.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
    <div class="form-grid-2"><div class="form-row"><label>累计消费 🥕 <span class="opt">预存自动计入</span></label><input type="number" name="totalSpent" value="${data.totalSpent||0}" oninput="updateCustUpgradeHint(this)"></div>
    <div class="form-row"><label>当前预存余额 🥕</label><input type="number" name="balance" value="${data.balance||0}"></div></div>
    <div class="form-grid-2"><div class="form-row"><label>累计返 🥕</label><input type="number" name="totalCarrot" value="${data.totalCarrot||0}"></div>
    <div class="form-row"><label>已修图数量</label><input type="number" name="editedCount" value="${data.editedCount||0}"></div></div>
    <div class="form-grid-2"><div class="form-row"><label>首次约图</label><input type="date" name="firstOrderDate" value="${data.firstOrderDate||''}"></div>
    <div class="form-row"><label>最近约图</label><input type="date" name="lastOrderDate" value="${data.lastOrderDate||''}"></div></div>
    <div class="form-row"><label>生日 <span class="opt">月-日</span></label><input name="birthday" value="${esc(data.birthday||'')}" placeholder="如 10-02"></div>
    <div class="form-row"><label>喜欢风格 <span class="opt">自定义标签</span></label>
      <div id="styleTags" style="margin-bottom:6px">${styleHtml}</div>
      <div class="checks" id="styleChecks">${DB.tags.map(t=>`<label><input type="checkbox" value="${esc(t)}" ${(data.styles||[]).includes(t)?'checked':''}>${esc(t)}</label>`).join('')}</div>
      <div style="margin-top:6px;display:flex;gap:6px"><input id="newTagInput" placeholder="新建标签…" style="flex:1;padding:6px 10px;border:1px solid var(--line);border-radius:6px"><button type="button" class="btn btn-ghost btn-sm" onclick="addNewTag()">＋ 添加</button></div>
      <div style="margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)">
        <div style="font-size:11px;color:var(--ink-light);margin-bottom:4px">🗑️ 删除标签（不可恢复）</div>
        <div id="tagManageArea" style="display:flex;flex-wrap:wrap;gap:4px">${DB.tags.map(t=>`<span class="tag-pill" style="cursor:default">${esc(t)}<span class="x" onclick="deleteTag('${esc(t)}')" title="删除此标签">✕</span></span>`).join('')||'<span class="cell-sub" style="font-size:12px">暂无标签</span>'}</div>
      </div>
    </div>
    <div class="form-row"><label>是否愿意收到活动通知 <span class="opt">新活动/会员福利</span></label>

  const foot=`${id?`<button class="btn btn-danger" onclick="deleteCustomer('${id}')">删除</button>`:''}<button class="btn btn-ghost" onclick="closeDrawer()">取消</button><button class="btn btn-primary" onclick="saveCustomer('${id||''}')">${isNew?'创建':'保存'}</button>`;
  openDrawer((isNew?'＋ 新建客户':'✏️ 编辑客户')+(c?` · ${esc(custName(c))}`:''),body,foot);

function updateCustUpgradeHint(input){const form=input.closest('form');const spent=Number(input.value)||0;const up=upgradeInfo({totalSpent:spent});const box=form.querySelector('.form-row label .opt')?.closest('.form-row').querySelector('div[style*="bg"]');if(!box)return;box.innerHTML=levelBadge(up.level)+' '+(up.next?`<span class="hint upgrade" style="display:inline;margin-left:6px">距 ${up.next} 还差 ${up.need}🥕</span>`:'<span class="hint" style="display:inline;margin-left:6px">已达最高 👑</span>');}
function addNewTag(){const inp=$('newTagInput');const v=inp.value.trim();if(!v)return;if(!DB.tags.includes(v))DB.tags.push(v);save();const c=$('styleChecks');const lbl=document.createElement('label');lbl.innerHTML=`<input type="checkbox" value="${esc(v)}" checked>${esc(v)}`;c.appendChild(lbl);inp.value='';refreshTagManageArea();}
function refreshTagManageArea(){const box=$('tagManageArea');if(!box)return;box.innerHTML=DB.tags.map(t=>`<span class="tag-pill" style="cursor:default">${esc(t)}<span class="x" onclick="deleteTag('${esc(t)}')" title="删除此标签">✕</span></span>`).join('')||'<span class="cell-sub" style="font-size:12px">暂无标签</span>';}
function deleteTag(tag){
  // 检查是否有客户正在使用
  const usedBy=DB.customers.filter(c=>(c.styles||[]).includes(tag));
  const msg=usedBy.length?`标签「${tag}」正在被 ${usedBy.length} 位客户使用，删除后将从这些客户中移除。确定删除？`:`确定删除标签「${tag}」？`;
  confirmAct(msg,()=>{
    DB.tags=DB.tags.filter(t=>t!==tag);
    // 从所有客户的 styles 中移除
    DB.customers.forEach(c=>{if(c.styles)c.styles=c.styles.filter(s=>s!==tag);});
    save();
    // 从 checkbox 列表中移除
    const chk=document.querySelector(`#styleChecks input[value="${tag}"]`);
    if(chk)chk.parentElement.remove();
    refreshTagManageArea();
    toast('标签已删除','ok');
  });
}
function removeTag(el,id,tag){if(!id)return;const c=getCustomer(id);if(!c)return;c.styles=(c.styles||[]).filter(s=>s!==tag);save();el.parentElement.remove();}
function saveCustomer(id){const f=$('custForm');const data={wechatName:f.wechatName.value.trim(),douyinName:f.douyinName.value.trim(),wechatNote:f.wechatNote.value.trim(),phone:f.phone.value.trim(),status:f.status.value,totalSpent:Number(f.totalSpent.value)||0,balance:Number(f.balance.value)||0,totalCarrot:Number(f.totalCarrot.value)||0,editedCount:Number(f.editedCount.value)||0,firstOrderDate:f.firstOrderDate.value,lastOrderDate:f.lastOrderDate.value,birthday:f.birthday.value.trim(),styles:[...f.querySelectorAll('#styleChecks input:checked')].map(c=>c.value),notifyOptIn:f.notifyOptIn.checked,notes:f.notes.value.trim()};
  if(!data.wechatName&&!data.wechatNote){toast('请填写微信昵称或备注','err');return;}
  if(id){const idx=DB.customers.findIndex(c=>c.id===id);if(idx>=0)DB.customers[idx]={...DB.customers[idx],...data};}
  else{data.id=nextId('c');data.createdAt=Date.now();DB.customers.push(data);}
  save();closeDrawer();renderCustomers();renderDashboard();toast(id?'已保存':'已创建','ok');}
function deleteCustomer(id){const c=getCustomer(id);if(!c)return;const orderCnt=DB.orders.filter(o=>o.customerId===id).length;const schCnt=DB.schedules.filter(s=>s.customerId===id).length;confirmAct(`删除客户 ${custName(c)}？${orderCnt?`关联 ${orderCnt} 个订单、`:''}${schCnt?`${schCnt} 条排单、`:''}将一并删除。`,()=>{DB.customers=DB.customers.filter(x=>x.id!==id);DB.orders=DB.orders.filter(o=>o.customerId!==id);DB.schedules=DB.schedules.filter(s=>s.customerId!==id);save();closeDrawer();renderCustomers();renderDashboard();toast('已删除','ok');});}

    <dt>等级</dt><dd>${levelBadge(calcLevel(c.totalSpent))}</dd><dt>累计消费</dt><dd>${fmtMoney(c.totalSpent)}🥕</dd>
    <dt>预存余额</dt><dd>${fmtMoney(c.balance)}🥕</dd><dt>累计返🥕</dt><dd>${fmtMoney(c.totalCarrot)}🥕</dd>
    <dt>已修图</dt><dd>${c.editedCount||0} 张</dd></div></div>
    <div class="detail-sec"><h4>📅 约图记录</h4><div class="kv"><dt>首次约图</dt><dd>${fmtDate(c.firstOrderDate)}</dd><dt>最近约图</dt><dd>${fmtDate(c.lastOrderDate)}</dd></div>

function openRechargeForm(custId){
  const c=getCustomer(custId);if(!c){toast('客户不存在','err');return;}
  const presets=PRESET_TABLE.map(p=>`<button type="button" class="btn btn-ghost btn-sm" onclick="pickPreset(${p.amt})">${p.amt}🥕 → 到账${p.amt+p.gift}🥕</button>`).join('');
  const body=`<form id="rcForm" onsubmit="return false">
    <div class="form-row"><label>客户</label><div style="padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">${esc(custName(c))} · 当前余额 ${fmtMoney(c.balance)}🥕 · ${levelBadge(calcLevel(c.totalSpent))}</div></div>
    <div class="form-row"><label>预存金额 🥕</label><input type="number" id="rcAmount" name="amount" value="100" oninput="updateRechargePreview()"><div class="hint">选择预设档位：</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${presets}</div></div>
    <div class="form-row"><label>预存明细</label><div id="rcPreview" style="padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:13px"></div></div>
  </form>`;
  const foot=`<button class="btn btn-ghost" onclick="closeDrawer()">取消</button><button class="btn btn-primary" onclick="saveRecharge('${custId}')">确认预存</button>`;
  openDrawer('💰 添加预存 · '+esc(custName(c)),body,foot);
  setTimeout(updateRechargePreview,50);
}
function pickPreset(amt){$('rcAmount').value=amt;updateRechargePreview();}
function updateRechargePreview(){const amt=Number($('rcAmount').value)||0;const gift=getPresetGift(amt);const total=amt+gift;
  $('rcPreview').innerHTML=`<div class="pay-row"><span>预存金额</span><b>${fmtMoney(amt)}🥕</b></div><div class="pay-row"><span>赠送福利</span><b style="color:var(--green)">+${fmtMoney(gift)}🥕</b></div><div class="pay-row total"><span>实际到账</span><b>${fmtMoney(total)}🥕</b></div>`;
}
function saveRecharge(custId){
  const f=$('rcForm');const amt=Number(f.amount.value)||0;if(amt<=0){toast('请输入预存金额','err');return;}
  const c=getCustomer(custId);if(!c)return;
  const gift=getPresetGift(amt);const total=amt+gift;
  const oldLevel=calcLevel(c.totalSpent);
  // 预存金额计入累计消费
  c.totalSpent=(Number(c.totalSpent)||0)+amt;
  // 余额增加(预存+赠送)
  c.balance=(Number(c.balance)||0)+total;
  const newLevel=calcLevel(c.totalSpent);
  const upgraded=newLevel && newLevel!==oldLevel;
  // 记录预存
  const rec={id:nextId('r'),customerId:custId,time:nowDT(),amount:amt,gift:gift,total:total,oldLevel,newLevel,upgraded};
  DB.recharges.push(rec);
  save();closeDrawer();
  // 生成文案
  const txt=buildRechargeText(c,rec,upgraded,oldLevel,newLevel);
  showCopyModal('💰 预存完成文案',txt);
  toast('预存成功','ok');
}

function renderOrders(){
  if(!$('ordFilterStatuses').children.length)renderOrdFilterStatuses();
  const q=($('ordSearch').value||'').trim().toLowerCase();
  const statusChks=document.querySelectorAll('#ordFilterStatuses input:checked');
  const statusSet=new Set([...statusChks].map(c=>c.value));
  const ofUrgent=$('ofUrgent')?.checked;
  const amountMin=Number($('ofAmountMin')?.value)||0;
  const amountMax=Number($('ofAmountMax')?.value)||0;
  const ofDeadline=$('ofDeadline')?.value||'';
  const ofOrderTime=$('ofOrderTime')?.value||'';
  const sort=$('ordSort').value||'time';
  let list=DB.orders.slice();
  if(q)list=list.filter(o=>{const c=getCustomer(o.customerId);return[o.id,c?custName(c):'',c?c.phone:''].some(v=>(v||'').toLowerCase().includes(q));});
  if(statusSet.size)list=list.filter(o=>statusSet.has(o.status));
  if(ofUrgent)list=list.filter(o=>o.isUrgent);
  if(amountMin)list=list.filter(o=>(Number(o.amount)||0)>=amountMin);
  if(amountMax)list=list.filter(o=>(Number(o.amount)||0)<=amountMax);
  if(ofDeadline){const today=todayStr();if(ofDeadline==='today')list=list.filter(o=>(o.deadline||'').slice(0,10)===today);else if(ofDeadline==='3day'){const limit=new Date(Date.now()+3*86400000);list=list.filter(o=>{const d=new Date(o.deadline||'');return!isNaN(d)&&d<=limit;});}else if(ofDeadline==='overdue')list=list.filter(o=>(o.deadline||'').slice(0,10)<today&&o.status!=='已完成'&&o.status!=='已取消');}
  if(ofOrderTime){const today=todayStr();if(ofOrderTime==='today')list=list.filter(o=>(o.orderTime||'')===today);else{const days=parseInt(ofOrderTime);const limit=new Date(Date.now()-days*86400000);list=list.filter(o=>{const d=new Date(o.orderTime||'');return!isNaN(d)&&d>=limit;});}}
  // 排序
  if(sort==='amount-desc')list.sort((a,b)=>(b.amount||0)-(a.amount||0));
  else if(sort==='amount-asc')list.sort((a,b)=>(a.amount||0)-(b.amount||0));
  else if(sort==='deadline-asc')list.sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));
  else if(sort==='deadline-desc')list.sort((a,b)=>(b.deadline||'').localeCompare(a.deadline||''));
  else if(sort==='time-asc')list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  else if(sort==='status')list.sort((a,b)=>ORDER_STATUS.indexOf(a.status)-ORDER_STATUS.indexOf(b.status));
  else list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  // badge
  const cnt=statusSet.size+(ofUrgent?1:0)+(amountMin?1:0)+(amountMax?1:0)+(ofDeadline?1:0)+(ofOrderTime?1:0);
  const badge=$('ordFilterBadge');if(badge){badge.style.display=cnt?'':'none';badge.textContent=cnt?('筛选中 '+cnt):'';}
  const tb=$('ordTbody');
  if(!list.length){tb.innerHTML=`<tr><td colspan="9"><div class="empty"><span class="em">📦</span>没有符合条件的订单</div></td></tr>`;return;}
  tb.innerHTML=list.map(o=>{const c=getCustomer(o.customerId);const canComplete=o.status!=='已完成'&&o.status!=='已取消';
    return `<tr${o.status==='已完成'?' style="opacity:.5"':''}>
      <td class="cell-sub">${o.id}</td>
      <td><div class="cell-main">${esc(c?custName(c):'未知')}</div><div class="cell-sub">${c?esc(c.id):''}</div></td>
      <td class="cell-sub">${fmtDate(o.orderTime)}</td>
      <td class="cell-sub">${o.deadline?fmtDateTime(o.deadline):'—'}${o.isUrgent?'<br><span class="badge b-urgent">加急</span>':''}</td>
      <td>${fmtMoney(o.amount)}🥕${o.payment?`<div class="cell-sub">${payBadge(o.payment)}</div>`:''}</td>
      <td>${o.imageCount||0}</td>
      <td>${o.payment?payBadge(o.payment):'—'}</td>
      <td>${statusBadge(o.status)}</td>
      <td style="white-space:nowrap">
        ${canComplete?`<button class="btn btn-success btn-sm" onclick="event.stopPropagation();quickCompleteOrder('${o.id}')">✓ 完成</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openOrderForm('${o.id}')">编辑</button>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deleteOrder('${o.id}')" style="color:var(--red)">删除</button>
      </td>
    </tr>`;}).join('');
}

function clearOrdFilters(){document.querySelectorAll('#ordFilterStatuses input').forEach(c=>c.checked=false);if($('ofUrgent'))$('ofUrgent').checked=false;['ofAmountMin','ofAmountMax'].forEach(id=>{if($(id))$(id).value='';});if($('ofDeadline'))$('ofDeadline').value='';if($('ofOrderTime'))$('ofOrderTime').value='';renderOrders();}

function deleteOrdPlan(i){DB.ordPlans.splice(i,1);save();renderOrdSavedPlans();toast('已删除','ok');}
function openOrderForm(id,presetDate){

  const data=o||{orderTime:presetDate||todayStr(),startTime:(presetDate||todayStr())+'T09:00',status:'待制作',isUrgent:false,imageCount:0,amount:0,deposit:0,finalPay:0};

    <div class="form-row"><label>尾款 <span class="opt">自动50%</span></label><input type="number" name="finalPay" value="${data.finalPay||0}" readonly style="background:var(--bg)"></div></div>

    <div class="form-row"><label>加急</label><label class="toggle"><input type="checkbox" name="isUrgent" ${data.isUrgent?'checked':''}> 标记为加急</label></div></div>
    <div class="hint">💡 预存支付部分不重复计算会员等级/返🥕；现金部分完成后自动计入累计消费并返🥕</div>

function onAmountChange(){const f=$('ordForm');const amt=Number(f.amount.value)||0;f.deposit.value=Math.round(amt*0.5);f.finalPay.value=amt-Math.round(amt*0.5);const custId=f.customerId.value;const c=getCustomer(custId);const bal=c?c.balance:0;const pay=calcPayment(amt,bal);updatePayDetail(pay);if(f.startTime.value)updateDeadline(f.startTime);}
function updatePayDetail(pay){const box=$('payDetail');if(!box)return;box.innerHTML=`<div class="pay-row"><span>订单金额</span><b>${fmtMoney(pay.balancePay+pay.cashPay)}🥕</b></div><div class="pay-row"><span>余额支付</span><b style="color:#9333ea">${fmtMoney(pay.balancePay)}🥕</b></div><div class="pay-row"><span>现金支付</span><b style="color:#16a34a">${fmtMoney(pay.cashPay)}🥕</b></div><div class="pay-row total"><span>支付方式</span><b>${pay.method==='balance'?'全额预存':pay.method==='cash'?'全额现金':'混合支付'}</b></div>`;}
function updateDeadline(input){const f=input.closest('form');if(!f.startTime)return;const start=f.startTime.value;const dl=calcDeadline(start,12);f.deadline.value=dl;}
function onOrderStatusChange(){/*占位，实际在saveOrder处理*/}
function saveOrder(id){
  const f=$('ordForm');const custId=f.customerId.value;if(!custId){toast('请选择客户','err');return;}
  const c=getCustomer(custId);
  const amt=Number(f.amount.value)||0;
  const pay=calcPayment(amt,c?c.balance:0);
  const data={customerId:custId,orderTime:f.orderTime.value,startTime:f.startTime.value,deadline:f.deadline.value||calcDeadline(f.startTime.value,12),amount:amt,imageCount:Number(f.imageCount.value)||0,deposit:Number(f.deposit.value)||0,finalPay:Number(f.finalPay.value)||0,payment:pay,status:f.status.value,isUrgent:f.isUrgent.checked};
  if(!data.orderTime){toast('请选择下单时间','err');return;}
  let result=null;
  if(id){const idx=DB.orders.findIndex(o=>o.id===id);if(idx>=0){const old=DB.orders[idx];data.createdAt=old.createdAt;
    // 状态变为已完成：结算
    const wasDone=old.status==='已完成';const willDone=data.status==='已完成';
    if(!wasDone && willDone){result=completeOrder(DB.orders[idx],data);}
    else if(wasDone && !willDone){uncompleteOrder(DB.orders[idx],data);}
    DB.orders[idx]={...DB.orders[idx],...data};
  }}
  else{data.id=nextId('o');data.createdAt=Date.now();DB.orders.push(data);
    if(data.status==='已完成'){result=completeOrder(null,data);}
    if(c){if(!c.firstOrderDate)c.firstOrderDate=data.orderTime;c.lastOrderDate=data.orderTime;}
  }
  save();closeDrawer();renderOrders();renderDashboard();
  if(result){
    // 订单已完成
    if(result.hasBenefit){
      // 触发了权益，弹客户文案
      showCopyModal('🎉 订单完成文案',result.text);
      toast(result.upgraded?`🎉 ${custName(c)} 升级为 ${result.newLevel}！`:'订单已完成','ok');
    }else{
      // 没触发任何权益，弹后台提醒
      showNoBenefitAlert(c,data,pay);
    }
  }else if(!id){
    // 新建订单成功
    toast('🎉 订单创建成功！','ok');
    // 如果有现金支付部分，生成客户通知文案
    if(pay.cashPay>0){
      setTimeout(()=>{const text=buildOrderCreateText(c,data,pay);showCopyModal('📝 客户通知文案',text);},400);
    }
  }else{
    toast('已保存','ok');
  }
}
/* 订单完成结算：扣余额、现金部分计入累计消费、返🥕 */
function completeOrder(oldOrder,newData){
  const c=getCustomer(newData.customerId);if(!c)return null;
  const pay=newData.payment||calcPayment(newData.amount,c.balance);
  let balanceChanged=false;
  // 扣除余额支付部分
  if(pay.balancePay>0){c.balance=Math.max(0,(Number(c.balance)||0)-pay.balancePay);balanceChanged=true;}
  // 现金部分计入累计消费，并返🥕
  const cashPay=pay.cashPay||0;
  const oldLevel=calcLevel(c.totalSpent);
  let carrotReturn=0;
  if(cashPay>0){
    c.totalSpent=(Number(c.totalSpent)||0)+cashPay;
    const newLevel=calcLevel(c.totalSpent);
    // 按新等级返🥕（升级后用新等级比例）
    const rate=CARROT_RATE[newLevel]||0;
    carrotReturn=Math.round(cashPay*rate);
    if(carrotReturn>0){c.totalCarrot=(Number(c.totalCarrot)||0)+carrotReturn;c.balance=(Number(c.balance)||0)+carrotReturn;balanceChanged=true;}
  }
  c.editedCount=(Number(c.editedCount)||0)+(Number(newData.imageCount)||0);
  const newLevel=calcLevel(c.totalSpent);
  const upgraded=newLevel && newLevel!==oldLevel;
  // 判断是否有任何权益触发
  const hasBenefit=carrotReturn>0||upgraded||balanceChanged;
  const text=buildOrderCompleteText(c,newData,pay,carrotReturn,upgraded,oldLevel,newLevel);
  return {text,upgraded,oldLevel,newLevel,carrotReturn,hasBenefit,balanceChanged};
}
/* 取消完成：回退 */
function uncompleteOrder(oldOrder,newData){
  const c=getCustomer(newData.customerId);if(!c)return;
  const pay=oldOrder.payment||{balancePay:0,cashPay:oldOrder.amount||0};
  if(pay.balancePay>0){c.balance=(Number(c.balance)||0)+pay.balancePay;}
  const cashPay=pay.cashPay||0;
  if(cashPay>0){c.totalSpent=Math.max(0,(Number(c.totalSpent)||0)-cashPay);
    // 回退返🥕
    const oldLevel=calcLevel(c.totalSpent+cashPay);
    const rate=CARROT_RATE[oldLevel]||0;
    const carrotReturn=Math.round(cashPay*rate);
    c.totalCarrot=Math.max(0,(Number(c.totalCarrot)||0)-carrotReturn);
    c.balance=Math.max(0,(Number(c.balance)||0)-carrotReturn);
  }
  c.editedCount=Math.max(0,(Number(c.editedCount)||0)-(Number(newData.imageCount)||0));
}
function deleteOrder(id){confirmAct(`删除订单 ${id}？关联排单也会删除。`,()=>{const o=DB.orders.find(x=>x.id===id);if(o&&o.status==='已完成'){uncompleteOrder(o,o);}DB.orders=DB.orders.filter(x=>x.id!==id);DB.schedules=DB.schedules.filter(s=>s.orderId!==id);save();closeDrawer();renderOrders();renderDashboard();toast('已删除','ok');});}

/* ---------- 订单-排单联动 ---------- */
function syncScheduleFromOrder(o){
  if(!o||!o.id)return;
  // 找现有排单
  let sch=DB.schedules.find(s=>s.orderId===o.id);
  const date=(o.startTime||o.orderTime||'').slice(0,10);
  const hour=parseInt((o.startTime||'').slice(11,13))||9;
  const slot=hour<12?'上午':(hour<18?'下午':'晚上');
  if(sch){sch.date=date;sch.timeSlot=slot;sch.customerId=o.customerId;sch.status=o.status==='已完成'?'已完成':(o.status==='已取消'?'已取消':'已预约');}
  else{const ns={id:nextId('s'),orderId:o.id,date,timeSlot,customerId:o.customerId,status:o.status==='已完成'?'已完成':(o.status==='已取消'?'已取消':'已预约'),note:'',createdAt:Date.now()};DB.schedules.push(ns);}
}

let calCursor=new Date();
function shiftCalendar(n){calCursor.setMonth(calCursor.getMonth()+n);renderCalendar();}
function goToday(){calCursor=new Date();renderCalendar();}
/* 从订单获取某天的排单列表（按时间段排序） */
function getDayOrders(ds){
  return DB.orders.filter(o=>{
    const od=(o.orderTime||'').slice(0,10);
    return od===ds && o.status!=='已取消';
  }).sort((a,b)=>{
    const ha=parseInt((a.startTime||'').slice(11,13))||9;
    const hb=parseInt((b.startTime||'').slice(11,13))||9;
    return ha-hb;
  });
}
/* 根据订单开始时间算时段 */
function orderSlot(o){
  const h=parseInt((o.startTime||'').slice(11,13))||9;
  return h<12?'上午':(h<18?'下午':'晚上');
}
function renderCalendar(){
  const y=calCursor.getFullYear(),m=calCursor.getMonth();
  $('calMonth').textContent=`${y}年${m+1}月`;
  $('calDow').innerHTML=['日','一','二','三','四','五','六'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(y,m,1).getDay();const days=new Date(y,m+1,0).getDate();const today=todayStr();
  const cells=[];
  for(let i=0;i<first;i++)cells.push('<div class="cal-day empty"></div>');
  for(let d=1;d<=days;d++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evts=getDayOrders(ds);
    const isRest=DB.restDays.includes(ds);
    const isToday=ds===today;
    // 按时段分组
    const bySlot={'上午':[],'下午':[],'晚上':[]};
    evts.forEach(o=>{const s=orderSlot(o);bySlot[s].push(o);});
    // 计算各时段已用量（按张数）
    const usage=isRest?{'上午':0,'下午':0,'晚上':0}:getSlotUsage(ds);
    let evtHtml='';
    TIME_SLOTS.forEach(slot=>{
      const arr=bySlot[slot];
      const cap=SLOT_CAPACITY[slot];
      const used=Math.min(cap,Math.round(usage[slot]||0));
      const left=Math.max(0,cap-used);
      if(arr.length){
        // 有订单的时段：显示订单
        const show=arr.slice(0,2);
        evtHtml+=`<div class="cal-evt" style="font-weight:600;opacity:.7">${slot} ${left>0?`<span style="color:var(--green)">余${left}</span>`:'<span style="color:var(--red)">满</span>'}</div>`;
        evtHtml+=show.map(o=>{const c=getCustomer(o.customerId);const cls=o.status==='已完成'?'done':'';return `<div class="cal-evt ${cls}">${esc(c?maskName(custName(c)):'')}</div>`;}).join('');
        if(arr.length>2)evtHtml+=`<div class="cal-evt">+${arr.length-2}</div>`;
      }else if(!isRest && left>0){
        // 没有订单但有空闲的时段：显示空闲
        evtHtml+=`<div class="cal-evt" style="background:#f0fdf4;color:#16a34a;border-color:#bbf7d0">${slot} 空闲${left}</div>`;
      }
    });
    cells.push(`<div class="cal-day ${isToday?'today':''} ${isRest?'rest':''}" onclick="openDayModal('${ds}')">
      <div class="dnum">${d}</div>
      ${isRest?'<div class="cal-rest-tag">休息</div>':''}
      <div class="evts">${evtHtml}</div></div>`);
  }
  $('calGrid').innerHTML=cells.join('');
}

function openBirthdayList(){

/* 生成生日祝福文案 */
function openBirthdayText(custId){
  const c=getCustomer(custId);if(!c)return;
  const lv=calcLevel(c.totalSpent);
  const gift=BIRTHDAY_GIFT[lv]||0;
  const today=todayStr();
  // 检查今年是否已发放过生日福利
  const bdayKey=`bdayGift_${new Date().getFullYear()}`;
  const alreadyGifted=c[bdayKey]===today;
  let gifted=0;
  if(gift>0 && !alreadyGifted){
    c.balance=(Number(c.balance)||0)+gift;
    c[bdayKey]=today;
    gifted=gift;
    save();
  }
  const curBalance=Number(c.balance)||0;
  const text=`🎂 生日快乐呀宝宝 ˶>ᗜ<˶

今天可是宝宝一年中最特别的一天♡

兔子祝宝宝：

天天开心，万事顺遂，
越来越漂亮，拍照越来越出片，
钱包鼓鼓，烦恼退退，幸运值拉满 ǌ>ᴗ<ǌ

作为【${lv||'未入等级'}】的小礼物，
${gifted>0?`兔子已经悄悄把 ${gifted}🥕 兔兔余额\n送到宝宝的账户里啦🎁`:'🐰 之前已经把生日福利\n送到宝宝的账户里啦🎁'}

🥕 当前兔兔余额：${fmtMoney(curBalance)}🥕

希望这份小小的心意，
可以陪宝宝继续修更多漂亮照片♡

生日快乐！要一直做最闪闪发光的自己呀 ✨`;
  closeDrawer();closeBdayModal();
  showCopyModal('🎂 生日祝福文案',text);
  toast(gifted>0?`已赠送 ${gifted}🥕 生日余额`:'文案已生成','ok');
}

function buildOrderCreateText(c,order,pay){
  let t='🐰 宝宝，已经收到你的订单啦 ˶>ᗜ<˶\n\n';
  t+=`📷 修图数量：${order.imageCount||0} 张\n`;
  t+=`💰 订单金额：${fmtMoney(order.amount)}🥕\n`;
  if(pay.balancePay>0)t+=`🥕 余额支付：${fmtMoney(pay.balancePay)}🥕\n`;
  if(pay.cashPay>0)t+=`💵 现金支付：${fmtMoney(pay.cashPay)}🥕\n`;
  t+='\n兔子会尽快安排制作，预计完成时间：'+(order.deadline?fmtDateTime(order.deadline):'待定')+'\n\n';
  t+='完成后会第一时间通知宝宝♡\n\n谢谢宝宝的支持 ǌ>ᴗ<ǌ';
  return t;
}
function buildOrderCompleteText(c,order,pay,carrotReturn,upgraded,oldLevel,newLevel){
  let t='🎉 宝宝，这次订单已经完成啦 ˶>ᗜ<˶\n\n感谢宝宝一直来的支持♡\n\n';
  // 返🥕（仅现金部分有返）

  // 余额
  if(Number(c.balance)>0){t+=`🥕 当前预存余额：${fmtMoney(c.balance)}🥕\n\n`;}
  // 升级
  if(upgraded){t+=`🎊 恭喜宝宝！\n\n因为累计消费已经达到 ${fmtMoney(c.totalSpent)}🥕，\n已经成功升级成为【${newLevel}】啦♡\n\n🐰 已自动解锁：\n${(LEVEL_PERKS[newLevel]||[]).map(p=>`• ${p}`).join('\n')}\n\n以后这些权益都会自动生效哦♡\n\n`;}
  t+='谢谢宝宝一路陪兔子成长，希望以后还能一起修很多很多漂亮照片，也一起慢慢升级呀 ǌ>ᴗ<ǌ';
  return t;
}
function buildRechargeText(c,rec,upgraded,oldLevel,newLevel){
  let t='🎉 宝宝，已经收到预存啦 ˶>ᗜ<˶\n\n兔子已经帮宝宝充值到兔窝账户啦♡\n\n';
  t+=`💰 本次预存：${rec.amount}🥕\n\n🎁 赠送福利：${rec.gift}🥕\n\n🥕 当前预存余额：${fmtMoney(c.balance)}🥕\n\n👑 当前会员等级：【${calcLevel(c.totalSpent)||'未入等级'}】\n\n`;
  t+='以后余额可以直接用于约图抵扣，会员权益也会一直自动生效哦♡\n\n';
  if(upgraded){t+=`🎊 恭喜宝宝！\n\n因为累计消费已经达到 ${fmtMoney(c.totalSpent)}🥕，\n已经成功升级成为【${newLevel}】啦♡\n\n🐰 已自动解锁：\n${(LEVEL_PERKS[newLevel]||[]).map(p=>`• ${p}`).join('\n')}\n\n`;}
  return t;
}
